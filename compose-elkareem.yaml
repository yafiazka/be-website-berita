# ============================================================
# Elkareem - Compose (Podman Desktop / Docker Compatible)
# PHP 8.1 (Sail) | Redis 7.2.6 | Frontend React/Vite
# Note: MySQL stays on LOCAL host machine
# ============================================================

services:

  # ── PHP 8.1 (Laravel Sail based) ─────────────────────────
  app:
    build:
      context: ./docker/8.1
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    container_name: elkareem-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"           # Akses Laravel: http://localhost:8085
    volumes:
      - ".:/var/www/html"
    env_file:
      - .env
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      DB_HOST: '${DB_HOST:-global-mysql}'
      DB_PORT: '${DB_PORT:-3306}'
      DB_DATABASE: '${DB_DATABASE:-elkareem}'
      DB_USERNAME: '${DB_USERNAME:-root}'
      DB_PASSWORD: '${DB_PASSWORD:-root}'
      REDIS_HOST: '${REDIS_HOST:-global-redis}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      REDIS_CLIENT: '${REDIS_CLIENT:-predis}'
    networks:
      - elkareem-network
      - global-db-net


  # ── Frontend SPA Pantau (React + Vite) ───────────────────
  frontend:
    image: node:20-alpine
    container_name: elkareem-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"         # Port default Vite — SPA Pantau
    volumes:
      - "./frontend:/app"
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_BASE_URL=http://localhost:8085/api
    networks:
      - elkareem-network


  # ── MitraKita SPA (React + Vite) ─────────────────────────
  mitrakita:
    image: node:20-alpine
    container_name: elkareem-mitrakita
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5174:5174"         # Port MitraKita
    volumes:
      - "./mitrakita:/app"
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host --port 5174"
    environment:
      - VITE_API_BASE_URL=http://localhost:8085/api
    networks:
      - elkareem-network


# ── Networks ──────────────────────────────────────────────────
networks:
  elkareem-network:
    driver: bridge
  global-db-net:
    external: true
