# ============================================================
# Backend Website Berita - Compose (Podman Desktop / Docker Compatible)
# PHP 8.3 Apache | Redis (global-redis) | MySQL (global-mysql)
# ============================================================

services:

  # ── PHP 8.3 Backend API + Backpack CMS ────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berita-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8086}:80"           # Akses Laravel: http://localhost:8086
    volumes:
      - ".:/var/www/html"
    env_file:
      - .env
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: '${DB_HOST:-global-mysql}'
      DB_PORT: '${DB_PORT:-3306}'
      DB_DATABASE: '${DB_DATABASE:-be_website_berita}'
      DB_USERNAME: '${DB_USERNAME:-root}'
      DB_PASSWORD: '${DB_PASSWORD:-root}'
      REDIS_HOST: '${REDIS_HOST:-global-redis}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      REDIS_CLIENT: '${REDIS_CLIENT:-phpredis}'
    networks:
      - berita-network
      - global-db-net

# ── Networks ──────────────────────────────────────────────────
networks:
  berita-network:
    driver: bridge
  global-db-net:
    external: true
